[package]
name = "grove-host"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false
description = "One game session, in one process: the sockets, the clock, the isolate and the drain around @platform/sim."

[[bin]]
name = "grove-host"
path = "src/main.rs"

[dependencies]
# The isolate. deno_core is the whole reason this half is Rust: it gives a per-session V8 isolate
# with its own heap limit and a terminate_execution a watchdog can reach, which a Node subprocess
# does not.
deno_core = "0.411"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# The ticket. `subtle` rather than a bare `==`, because the comparison is over a signature.
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
base64 = "0.22"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }

[profile.release]
# A tick is a latency budget, not a throughput one, so the optimiser is worth the build time.
lto = "thin"
codegen-units = 1
