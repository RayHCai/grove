# The Rust half of the fleet. One lock and one pinned toolchain: a float difference between two
# toolchains is a desync a playtest cannot reproduce, and a second lockfile is a second place for a
# transitive dependency to be a different version.

[workspace]
resolver = "2"
members = ["game-instance", "asset-upload-service", "request-id"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Held once rather than per crate: this process sits between the Go services and answers their
# probes, so a chain is only as long as its quietest link.
grove-request-id = { path = "request-id" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["timeout"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# The asset stream this fleet queues work on, and the one HTTP call a worker makes back to
# @grove/api to settle it.
redis = { version = "1.7", features = ["tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "http2"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Both crates are latency budgets rather than throughput ones, so the optimiser is worth the build
# time. Profiles only apply from a workspace root, which is why this sits here and not in a member.
[profile.release]
lto = "thin"
codegen-units = 1

# Which lints, stated once here; how strictly, stated by the `-D warnings` each gate passes. Split
# that way because a contributor's `cargo check` should name a problem without refusing to build,
# and CI should refuse.
[workspace.lints.rust]
# Neither crate needs it, and a raw pointer in a process that holds a V8 heap is the kind of fault
# that surfaces somewhere else entirely.
unsafe_code = "forbid"
# Lower priority than the lints above, which is how Cargo is told a group may be overridden by a
# name rather than colliding with one.
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# A debugging aid that reached a release is a line in production logs nobody meant to ship, and
# these services log through `tracing` so a handler can be found by its request id.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# A placeholder that compiles is a route that answers a panic.
todo = "deny"
unimplemented = "deny"
