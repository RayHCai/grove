[package]
name = "grove-asset-upload-service"
description = "The worker that inspects every asset a creator uploads before the CDN may serve it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "grove-asset-upload-service"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }

# The API and the bucket are seams the worker holds as trait objects, and a trait with an async fn
# in it is not dyn-safe.
async-trait = "0.1"

serde = { workspace = true }
# A JSON asset is checked by parsing it, which is the one check its type has.
serde_json = { workspace = true }

# The asset stream a save queues work on, and the calls this service makes out: the API, the bucket.
redis = { workspace = true }
reqwest = { workspace = true }

grove-request-id = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `start_paused` on a test, so a backoff is asserted rather than waited out, and raw socket writes.
tokio = { workspace = true, features = ["test-util", "io-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
