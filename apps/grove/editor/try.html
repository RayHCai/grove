<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Grove Editor — try it</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'%3E%3Crect width='32' height='32' fill='%232e2a24'/%3E%3Cpath fill='%237d9c50' d='M14 10h4v4h-4zM10 14h12v4H10zM6 18h20v4H6z'/%3E%3C/svg%3E"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
            rel="stylesheet"
        />
        <script>
            (function () {
                var stored = null;
                try {
                    stored = localStorage.getItem('grove:theme');
                } catch (e) {}
                var dark =
                    stored === 'dark' ||
                    (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            })();
        </script>
    </head>
    <body class="pg-scanlines">
        <div id="root"></div>
        <script type="module" src="/src/try.tsx"></script>
    </body>
</html>
