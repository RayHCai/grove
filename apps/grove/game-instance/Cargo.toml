[package]
name = "grove-game-instance"
description = "One game session, in one process: the sockets, the clock, the isolate and the drain around @platform/sim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "grove-game-instance"
path = "src/main.rs"

[dependencies]
# The isolate. deno_core is the whole reason this half is Rust: it gives a per-session V8 isolate
# with its own heap limit and a terminate_execution a watchdog can reach, which a Node subprocess
# does not.
deno_core = "0.411"

tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true, features = ["sink"] }

serde = { workspace = true }
serde_json = { workspace = true }

# The ticket. `subtle` rather than a bare `==`, because the comparison is over a signature.
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
# `oneshot`, so a route is asserted against the layers wrapped round it rather than called direct.
tower = { workspace = true, features = ["util"] }
