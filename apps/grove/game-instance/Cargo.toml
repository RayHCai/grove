[package]
name = "grove-game-instance"
description = "One game session, in one process: the sockets, the clock, the isolate and the drain around @platform/sim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "grove-game-instance"
path = "src/main.rs"

[dependencies]
# The isolate. deno_core is the whole reason this half is Rust: it gives a per-session V8 isolate
# with its own heap limit and a terminate_execution a watchdog can reach, which a Node subprocess
# does not.
deno_core = "0.413"

tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true, features = ["sink"] }
# The listener, driven directly because `axum::serve` sets no timer and hyper then drops its header deadline.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

# The ticket: Ed25519 under public keys only, so this process can check a ticket and never mint one.
ring = "0.17"
base64 = { workspace = true }

reqwest = { workspace = true }

grove-request-id = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `io-util`, so a test can speak raw HTTP to the listener the way a peer that misbehaves does.
tokio = { workspace = true, features = ["test-util", "io-util"] }
# `oneshot`, so a route is asserted against the layers wrapped round it rather than called direct.
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
