pre-commit:
    parallel: true
    jobs:
        - name: format
          glob: '*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml}'
          run: pnpm exec prettier --write {staged_files}
          stage_fixed: true

        - name: lint
          glob: '*.{ts,tsx,js,mjs,cjs}'
          # oxlint exits non-zero when every path it is handed is one it ignores.
          exclude:
              - 'docs/*'
          run: pnpm exec oxlint --deny-warnings {staged_files}

        - name: typecheck
          glob: '*.{ts,tsx}'
          run: pnpm run typecheck

        - name: no-design-doc-citations
          glob: '*.{ts,tsx,js,mjs,cjs,json,yml,yaml}'
          exclude:
              - 'docs/*'
          run: |
              if grep -lE '§ ?[0-9]' {staged_files}; then
                  echo 'Design-doc section citations are banned outside docs/ — state the constraint itself.'
                  exit 1
              fi

pre-push:
    jobs:
        - name: test
          run: pnpm run test

commit-msg:
    jobs:
        # Single quotes only: on Windows lefthook re-quotes a multi-line `run` for sh.exe and eats inner double quotes.
        - name: conventional-commit
          run: |
              head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .{1,}' \
                || { echo 'Commit message must follow Conventional Commits, e.g. feat(core): add dispatcher'; exit 1; }
