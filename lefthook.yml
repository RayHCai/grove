pre-commit:
    parallel: true
    jobs:
        - name: format
          glob: '*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml}'
          run: pnpm exec prettier --write {staged_files}
          stage_fixed: true

        - name: lint
          glob: '*.{ts,tsx,js,mjs,cjs}'
          # oxlint exits non-zero when every path it is handed is one it ignores.
          exclude:
              - 'docs/*'
          run: pnpm exec oxlint --deny-warnings {staged_files}

        # Every native package carries a package.json, so turbo reaches the Go module and both
        # crates through the same script CI runs.
        - name: typecheck
          glob: '*.{ts,tsx,go,rs}'
          run: pnpm run typecheck

        # Formatting is what needs its own jobs: prettier can read neither a crate nor a Go file, so
        # the glob on the format job above never matches one.
        - name: rust-format
          root: 'apps/grove/'
          glob: '*.rs'
          run: node ../../scripts/cargo.mjs fmt --all --check

        # Handed the staged paths, because gofmt needs no module to read a file.
        - name: go-format
          glob: '*.go'
          run: node scripts/gofmt-check.mjs {staged_files}

        # The same script the CI gate runs, handed the staged paths. One implementation, so the hook
        # and the gate cannot come to disagree about what is banned.
        - name: no-design-doc-citations
          run: node scripts/check-citations.mjs {staged_files}

pre-push:
    jobs:
        - name: test
          run: pnpm run test

commit-msg:
    jobs:
        # Single quotes only: on Windows lefthook re-quotes a multi-line `run` for sh.exe and eats inner double quotes.
        - name: conventional-commit
          run: |
              head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .{1,}' \
                || { echo 'Commit message must follow Conventional Commits, e.g. feat(core): add dispatcher'; exit 1; }
