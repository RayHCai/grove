name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job here reads the tree and writes nothing back. Stated rather than inherited, because the
# default is whatever the repository setting happens to be, and a workflow that runs third-party
# actions over a pull request's code should not be one settings change away from a writable token.
permissions:
    contents: read

env:
    TURBO_TELEMETRY_DISABLED: 1
    DO_NOT_TRACK: 1

jobs:
    ci:
        name: ${{ matrix.task.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            # The toolchains this job installs, so their absence fails here rather than skipping.
            # Not set on `determinism`, which installs none.
            GROVE_REQUIRE_TOOLCHAIN: go,cargo,staticcheck,terraform

            # What the change reaches, rather than the whole tree, but only on a pull request. A
            # push to main runs everything, so a package the affected graph failed to reach is red
            # on main within the minute rather than never. A file in no package is a root change and
            # selects every package, which is what keeps a `tsconfig.base.json` or a `go.mod` edit
            # from narrowing the gate to nothing.
            TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
            AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        strategy:
            fail-fast: false
            matrix:
                task:
                    # oxlint and prettier read the tree directly rather than through turbo, so
                    # neither narrows, and neither is slow enough to want to.
                    - name: lint
                      # A disable that suppresses nothing is a rule off for whatever lands there next.
                      run: pnpm run lint --report-unused-disable-directives
                    - name: format
                      run: pnpm run format:check && pnpm -r --if-present run format:check
                    - name: typecheck
                      run: pnpm run typecheck $AFFECTED
                    - name: build
                      run: pnpm run build $AFFECTED
                    - name: test
                      run: pnpm run test $AFFECTED
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            # The native services shell to cargo and go. Without a toolchain their scripts skip with a
            # line rather than failing, which would make the gate green over a half that was never
            # compiled, so both are installed here even though only some jobs reach them.
            # rustup ships on the runner and reads the channel and components from
            # apps/grove/rust-toolchain.toml, so the pin lives in that one file.
            - name: Install the pinned Rust toolchain
              working-directory: apps/grove
              run: rustup toolchain install && rustc --version

            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  workspaces: apps/grove

            # Keyed on go.mod rather than go.sum: the Go half takes no third-party dependency, so no
            # go.sum exists to hash.
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.mod

            # Installed rather than run through dominikh/staticcheck-action: the gate is the same
            # `pnpm run typecheck` a contributor runs, and an action that runs the linter itself is a
            # second invocation of it that exists only here.
            - name: Install staticcheck
              run: |
                  version=$(sed -n "s/^const version = '\(.*\)';$/\1/p" scripts/staticcheck.mjs)
                  go install "honnef.co/go/tools/cmd/staticcheck@${version:?no version in scripts/staticcheck.mjs}"
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            # Without a Terraform on `PATH`, `@grove/infra` skips its own validate and fmt gates, so
            # every `.tf` file would land on main read by nothing. Unwrapped, so the exit code the
            # scripts read is Terraform's own rather than the wrapper's.
            - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
              with:
                  terraform_version: 1.14.3
                  terraform_wrapper: false

            # Only `typecheck` runs `terraform init`, and uncached it pays one unretried provider
            # download per root: twice a run, inside a timeout the whole TS, Go and Rust typecheck
            # already shares.
            - name: Cache Terraform providers
              if: matrix.task.name == 'typecheck'
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ${{ runner.temp }}/terraform-plugins
                  key: terraform-plugins-${{ runner.os }}-${{ hashFiles('apps/grove/infra/environments/*/.terraform.lock.hcl') }}

            # Created up front because a cache miss restores no directory, and Terraform reports a
            # missing one as a CLI configuration error on every command it runs.
            - name: Point Terraform at the plugin cache
              if: matrix.task.name == 'typecheck'
              run: |
                  mkdir -p "$RUNNER_TEMP/terraform-plugins"
                  echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugins" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache turbo
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: .turbo
                  key: turbo-${{ matrix.task.name }}-${{ runner.os }}-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ matrix.task.name }}-${{ runner.os }}-

            - name: ${{ matrix.task.name }}
              run: ${{ matrix.task.run }}

    # Identical floats across machines is the whole premise, and one runner on one V8 never tests it.
    # Only the test task repeats here: lint, format, typecheck and build cannot see a divergence.
    determinism:
        name: test (${{ matrix.os }}, node ${{ matrix.node }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    # A second architecture: the macOS runners are arm64.
                    - os: macos-latest
                      node: 24.16.0
                    # A second V8, on the architecture the pinned toolchain already covers.
                    - os: ubuntu-latest
                      node: 26
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache turbo
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: .turbo
                  # Namespaced away from `turbo-test-`: restore-keys match by prefix, so the ci
                  # job's test leg could otherwise restore a cache written where Go was absent.
                  key: turbo-determinism-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
                  restore-keys: |
                      turbo-determinism-${{ runner.os }}-node${{ matrix.node }}-

            - name: test
              # The engine and what composes it, chosen by directory so no native package is ever in it.
              run: >-
                  pnpm run test --filter='./packages/*' --filter='./libs/*' --filter='!./libs/go-grove'
                  --filter=./integration --filter=./bench --filter=./apps/playground

    # `-race` needs cgo and therefore a C compiler, so it stays out of the shared `test` script:
    # folded in there it would fail `pnpm run test`, and the pre-push hook, on every machine
    # without one, the outcome scripts/toolchain.mjs exists to avoid.
    race:
        name: race detector
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.mod

            # One module, so `./...` from the root is every Go package in the tree and a new service
            # is covered the day it is added. `-count=1` because a cached pass replays one past
            # interleaving, and a fresh schedule on every run is the only leverage the detector has.
            - name: race
              run: go test -race -count=1 -shuffle=on ./...

    citations:
        name: no design-doc citations
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            # The same script the pre-commit hook runs. Driven off everything git tracks rather than
            # a list of trees to scan, so a new top-level directory is covered the day it appears.
            # Run here with no paths, which adds the half a partial commit cannot check: that every
            # citation inside docs/ still names a section of docs/api_design.md.
            - name: Reject section citations outside docs/
              run: node scripts/check-citations.mjs

    # Every image the repository deploys, built to its runtime stage: a Dockerfile is otherwise read
    # by nothing until a deploy, which is the worst place to learn it no longer builds.
    docker:
        name: image (${{ matrix.image.name }})
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                image:
                    - name: api
                      file: apps/grove/api/Dockerfile
                    - name: game-builder
                      file: apps/grove/game-builder/Dockerfile
                    - name: game-manager
                      file: apps/grove/game-manager/Dockerfile
                    - name: server-manager
                      file: apps/grove/server-manager/Dockerfile
                    - name: asset-upload-service
                      file: apps/grove/asset-upload-service/Dockerfile
                    - name: local-fleet-box
                      file: docker/local-fleet-box.Dockerfile
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: .
                  file: ${{ matrix.image.file }}
                  target: runtime
                  push: false
                  cache-from: type=gha,scope=${{ matrix.image.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

    # Single required status check, so branch protection needs only one entry.
    ci-ok:
        name: CI passed
        if: always()
        needs: [ci, determinism, race, citations, docker]
        runs-on: ubuntu-latest
        steps:
            - name: Verify every job succeeded
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
