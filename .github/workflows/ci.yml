name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
    TURBO_TELEMETRY_DISABLED: 1
    DO_NOT_TRACK: 1

jobs:
    ci:
        name: ${{ matrix.task.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                task:
                    - name: lint
                      # Warn-tier rules only ratchet if they exit non-zero somewhere.
                      run: pnpm run lint --deny-warnings
                    - name: format
                      run: pnpm run format:check && pnpm --filter @grove/host run format:check
                    - name: typecheck
                      run: pnpm run typecheck
                    - name: build
                      run: pnpm run build
                    - name: test
                      run: pnpm run test
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: pnpm

            # @grove/host is a cargo crate whose build, test and typecheck shell to cargo. Without a
            # toolchain its scripts skip with a line rather than failing, which would make the gate
            # green over a half that was never compiled.
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.85.0
                  components: clippy, rustfmt

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/grove/host

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache turbo
              uses: actions/cache@v4
              with:
                  path: .turbo
                  key: turbo-${{ matrix.task.name }}-${{ runner.os }}-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ matrix.task.name }}-${{ runner.os }}-

            - name: ${{ matrix.task.name }}
              run: ${{ matrix.task.run }}

    # Identical floats across machines is the whole premise, and one runner on one V8 never tests it.
    # Only the test task repeats here — lint, format, typecheck and build cannot see a divergence.
    determinism:
        name: test (${{ matrix.os }}, node ${{ matrix.node }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    # A second architecture: the macOS runners are arm64.
                    - os: macos-latest
                      node: 24.16.0
                    # A second V8, on the architecture the pinned toolchain already covers.
                    - os: ubuntu-latest
                      node: 26
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache turbo
              uses: actions/cache@v4
              with:
                  path: .turbo
                  key: turbo-test-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
                  restore-keys: |
                      turbo-test-${{ runner.os }}-node${{ matrix.node }}-

            - name: test
              # The TypeScript half only — this job exists to run one simulation on two V8 builds,
              # and @grove/host's tests answer a question no second architecture changes.
              run: pnpm run test --filter='!@grove/host'

    citations:
        name: no design-doc citations
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v6

            # Grep, not lint: the ban covers comments, test titles, JSX text and JSON alike.
            # Matched with a trailing digit so this job and the pre-commit hook can name the char.
            - name: Reject section citations outside docs/
              run: |
                  if git grep -nE '§ ?[0-9]' -- 'packages' 'apps' 'examples' '*.json' \
                      ':(exclude,glob)**/DESIGN.md' ':(exclude,glob)**/README.md' \
                      ':(exclude,glob)**/readme.md' ':(exclude,glob)docs/**'; then
                    echo
                    echo 'Design-doc section citations are banned outside docs/ and DESIGN.md/README.md.'
                    echo 'State the constraint itself — the numbering drifts and the reader is not holding the doc.'
                    exit 1
                  fi

    # Single required status check, so branch protection needs only one entry.
    ci-ok:
        name: CI passed
        if: always()
        needs: [ci, determinism, citations]
        runs-on: ubuntu-latest
        steps:
            - name: Verify all matrix jobs succeeded
              run: |
                  if [ "${{ needs.ci.result }}" != "success" ]; then
                    echo "CI matrix result: ${{ needs.ci.result }}"
                    exit 1
                  fi
                  if [ "${{ needs.determinism.result }}" != "success" ]; then
                    echo "Cross-platform test result: ${{ needs.determinism.result }}"
                    exit 1
                  fi
                  if [ "${{ needs.citations.result }}" != "success" ]; then
                    echo "Citation gate result: ${{ needs.citations.result }}"
                    exit 1
                  fi
                  echo "All CI jobs passed."
