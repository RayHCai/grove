name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job here reads the tree and writes nothing back. Stated rather than inherited, because the
# default is whatever the repository setting happens to be, and a workflow that runs third-party
# actions over a pull request's code should not be one settings change away from a writable token.
permissions:
    contents: read

env:
    TURBO_TELEMETRY_DISABLED: 1
    DO_NOT_TRACK: 1

jobs:
    ci:
        name: ${{ matrix.task.name }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # The toolchains this job installs, so their absence fails here rather than skipping. Not
        # set on `determinism`, which installs none.
        env:
            GROVE_REQUIRE_TOOLCHAIN: go,cargo,staticcheck,terraform
        strategy:
            fail-fast: false
            matrix:
                task:
                    - name: lint
                      # Warn-tier rules only ratchet if they exit non-zero somewhere.
                      run: pnpm run lint --deny-warnings
                    - name: format
                      run: pnpm run format:check && pnpm -r --if-present run format:check
                    - name: typecheck
                      run: pnpm run typecheck
                    - name: build
                      run: pnpm run build
                    - name: test
                      run: pnpm run test
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: pnpm

            # The native services shell to cargo and go. Without a toolchain their scripts skip with a
            # line rather than failing, which would make the gate green over a half that was never
            # compiled — so both are installed here even though only some jobs reach them.
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.98.1
                  components: clippy, rustfmt

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/grove

            # Keyed on the go.mod files rather than go.sum: the Go half takes no
            # third-party dependency, so no go.sum exists to hash. A guard on go.work being present
            # would turn a lost workspace file into a skipped gate rather than a failing one.
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.work
                  cache-dependency-path: |
                      go.work
                      libs/go-grove/go.mod
                      apps/grove/*/go.mod

            # Installed rather than run through dominikh/staticcheck-action: the gate is the same
            # `pnpm run typecheck` a contributor runs, and an action that runs the linter itself is a
            # second invocation of it that exists only here.
            - name: Install staticcheck
              run: |
                  go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            # Without a Terraform on `PATH`, `@grove/infra` skips its own validate and fmt gates, so
            # every `.tf` file would land on main read by nothing. Unwrapped, so the exit code the
            # scripts read is Terraform's own rather than the wrapper's.
            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.14.3
                  terraform_wrapper: false

            # Only `typecheck` runs `terraform init`, and uncached it pays one unretried provider
            # download per root — twice a run, inside a timeout the whole TS, Go and Rust typecheck
            # already shares.
            - name: Cache Terraform providers
              if: matrix.task.name == 'typecheck'
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/terraform-plugins
                  key: terraform-plugins-${{ runner.os }}-${{ hashFiles('apps/grove/infra/environments/*/.terraform.lock.hcl') }}

            # Created up front because a cache miss restores no directory, and Terraform reports a
            # missing one as a CLI configuration error on every command it runs.
            - name: Point Terraform at the plugin cache
              if: matrix.task.name == 'typecheck'
              run: |
                  mkdir -p "$RUNNER_TEMP/terraform-plugins"
                  echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugins" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache turbo
              uses: actions/cache@v4
              with:
                  path: .turbo
                  key: turbo-${{ matrix.task.name }}-${{ runner.os }}-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ matrix.task.name }}-${{ runner.os }}-

            - name: ${{ matrix.task.name }}
              run: ${{ matrix.task.run }}

    # Identical floats across machines is the whole premise, and one runner on one V8 never tests it.
    # Only the test task repeats here — lint, format, typecheck and build cannot see a divergence.
    determinism:
        name: test (${{ matrix.os }}, node ${{ matrix.node }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    # A second architecture: the macOS runners are arm64.
                    - os: macos-latest
                      node: 24.16.0
                    # A second V8, on the architecture the pinned toolchain already covers.
                    - os: ubuntu-latest
                      node: 26
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache turbo
              uses: actions/cache@v4
              with:
                  path: .turbo
                  # Namespaced away from `turbo-test-`: restore-keys match by prefix, so the ci
                  # job's test leg could otherwise restore a cache written where Go was absent.
                  key: turbo-determinism-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
                  restore-keys: |
                      turbo-determinism-${{ runner.os }}-node${{ matrix.node }}-

            - name: test
              # The TypeScript half only — this job exists to run one simulation on two V8 builds, and
              # no native service's tests answer a question a second architecture changes. Every native
              # package is named: these runners ship Go and Rust on PATH, so nothing here would skip, and
              # the toolchains go.work and rust-toolchain.toml pin are one download apiece per leg.
              run: >-
                  pnpm run test --filter='!@grove/game-instance' --filter='!@grove/asset-upload-service'
                  --filter='!@grove/go-grove' --filter='!@grove/game-manager'
                  --filter='!@grove/instance-manager' --filter='!@grove/server-manager'

    # `-race` needs cgo and therefore a C compiler, so it stays out of the shared `test` script:
    # folded in there it would fail `pnpm run test`, and the pre-push hook, on every machine
    # without one — the outcome scripts/toolchain.mjs exists to avoid.
    race:
        name: race detector
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.work
                  cache-dependency-path: |
                      go.work
                      libs/go-grove/go.mod
                      apps/grove/*/go.mod

            # One job rather than a matrix over the modules: `-race` compiles the standard library
            # from source, and one build cache pays for that once instead of four times.
            #
            # `./...` from the workspace root matches no module, so each is entered in turn, and the
            # loop runs to the end — a race in the first must not hide the state of the other three.
            - name: race
              run: |
                  # Assigned before the loop so a `go list` that fails aborts the step, rather than
                  # yielding an empty word list that reports every module clean.
                  modules=$(go list -m -f '{{.Dir}}')
                  raced=
                  for module in $modules; do
                    echo "::group::$module"
                    # A cached pass replays one past interleaving, and a fresh schedule on
                    # every run is the only leverage the detector has.
                    (cd "$module" && go test -race -count=1 -shuffle=on ./...) || raced="$raced $module"
                    echo "::endgroup::"
                  done
                  if [ -n "$raced" ]; then
                    echo "Races or failures in:$raced"
                    exit 1
                  fi

    citations:
        name: no design-doc citations
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v6

            # Grep, not lint: the ban covers comments, test titles, JSX text and JSON alike.
            # Matched with a trailing digit so this job and the pre-commit hook can name the char.
            #
            # Everything tracked minus the places the citation belongs. Listing the trees to scan is
            # what left integration/, libs/ and bench/ — 65 TypeScript files — outside the gate, and
            # a new top-level directory joined them silently. AGENTS.md is excluded because the rule
            # it states is written with the character the rule bans.
            - name: Reject section citations outside docs/
              run: |
                  if git grep -nE '§ ?[0-9]' -- . \
                      ':(exclude,glob)**/DESIGN.md' ':(exclude,glob)**/README.md' \
                      ':(exclude,glob)**/readme.md' ':(exclude,glob)docs/**' \
                      ':(exclude)AGENTS.md'; then
                    echo
                    echo 'Design-doc section citations are banned outside docs/ and DESIGN.md/README.md.'
                    echo 'State the constraint itself — the numbering drifts and the reader is not holding the doc.'
                    exit 1
                  fi

    # Single required status check, so branch protection needs only one entry.
    ci-ok:
        name: CI passed
        if: always()
        needs: [ci, determinism, race, citations]
        runs-on: ubuntu-latest
        steps:
            - name: Verify all matrix jobs succeeded
              run: |
                  if [ "${{ needs.ci.result }}" != "success" ]; then
                    echo "CI matrix result: ${{ needs.ci.result }}"
                    exit 1
                  fi
                  if [ "${{ needs.determinism.result }}" != "success" ]; then
                    echo "Cross-platform test result: ${{ needs.determinism.result }}"
                    exit 1
                  fi
                  if [ "${{ needs.race.result }}" != "success" ]; then
                    echo "Race detector result: ${{ needs.race.result }}"
                    exit 1
                  fi
                  if [ "${{ needs.citations.result }}" != "success" ]; then
                    echo "Citation gate result: ${{ needs.citations.result }}"
                    exit 1
                  fi
                  echo "All CI jobs passed."
