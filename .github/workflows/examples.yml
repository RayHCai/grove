name: Examples

# The sample games compile against the creator surface, and they get their own workflow so a
# break in that surface is legible as its own failing check rather than a line in the CI matrix.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: examples-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
    TURBO_TELEMETRY_DISABLED: 1
    DO_NOT_TRACK: 1

jobs:
    regression:
        name: Sample game type-check
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build engine and examples
              run: pnpm --filter @platform/examples... run build
