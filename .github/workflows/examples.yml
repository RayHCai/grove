name: Examples

# The phase-0 sample games act as regression tests for the creator API.
# They run as their own workflow so a break here is legible at a glance.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: examples-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
    TURBO_TELEMETRY_DISABLED: 1
    DO_NOT_TRACK: 1

jobs:
    regression:
        name: Sample game regression
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build engine and examples
              run: pnpm --filter @platform/examples... run build

            - name: Run sample games
              run: pnpm --filter @platform/examples run test
