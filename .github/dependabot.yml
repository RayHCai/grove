version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          dev-toolchain:
              patterns:
                  - typescript
                  - turbo
                  - oxlint
                  - prettier
                  - vitest
                  - lefthook
                  - '@types/*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly

    - package-ecosystem: cargo
      directory: /apps/grove
      schedule:
          interval: weekly

    - package-ecosystem: gomod
      directory: /
      schedule:
          interval: weekly

    - package-ecosystem: docker
      directories:
          - /apps/grove/api
          - /apps/grove/asset-upload-service
          - /apps/grove/game-builder
          - /apps/grove/game-manager
          - /apps/grove/server-manager
          - /docker
      schedule:
          interval: weekly

    - package-ecosystem: terraform
      directories:
          - /apps/grove/infra/environments/*
          - /apps/grove/infra/modules/*
      schedule:
          interval: weekly
