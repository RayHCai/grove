version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          dev-toolchain:
              patterns:
                  - typescript
                  - turbo
                  - oxlint
                  - prettier
                  - vitest
                  - lefthook
                  - '@types/*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly

    - package-ecosystem: cargo
      directory: /apps/grove
      schedule:
          interval: weekly

    - package-ecosystem: gomod
      directory: /
      schedule:
          interval: weekly
